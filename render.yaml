services:
  - type: web
    name: sisr-signup
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAIL_TO
        value: statenislandsnowremovals@gmail.com
      - key: MAIL_FROM
        value: statenislandsnowremovals@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: statenislandsnowremovals@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
